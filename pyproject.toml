[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oreilo-insightmesh"
version = "3.0.0"
description = "OREiLO InsightMesh - original research and data intelligence workspace"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "OREiLO", email = "contact@oreilo.com"}]
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2,<3", "httpx>=0.27,<1", "python-multipart>=0.0.9", "pypdf>=5", "python-docx>=1.1", "reportlab>=4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5,<1"]

[project.scripts]
insightmesh = "insightmesh.cli:main"

[tool.setuptools.packages.find]
include = ["insightmesh*"]

[tool.ruff]
line-length = 100
